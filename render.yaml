services:
  - type: web
    name: orta-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://gjjayhhumqmkcauxbpmg.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RESEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
